<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MessageBox</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
        --bg:#0e1621;--sidebar:#17212b;--header:#1c2937;--input-bg:#242f3d;
        --bubble-my:#2b5278;--bubble-other:#182533;--text:#f5f5f5;--muted:#708499;
        --accent:#5288c1;--green:#4dcd6b;--red:#e05d5d;--hover:#1e2c3a;
        --pm-bg:#2a1f3d;--pm-border:#6b3fa0;--reply-border:#5288c1;
        --pinned-bg:#2b3a2b;--pinned-border:#4dcd6b;
        }
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}

        /* ═══ AUTH ═══ */
        #auth-screen{display:flex;align-items:center;justify-content:center;height:100vh;background:linear-gradient(135deg,#0e1621,#1a2a3a)}
        .auth-card{background:var(--sidebar);border-radius:16px;padding:40px;width:420px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center}
        .auth-logo{font-size:64px;margin-bottom:10px}
        .auth-title{font-size:28px;font-weight:700;margin-bottom:5px}
        .auth-sub{color:var(--muted);font-size:14px;margin-bottom:25px}
        .auth-input{width:100%;padding:14px 18px;margin-bottom:12px;background:var(--input-bg);border:2px solid transparent;border-radius:10px;color:var(--text);font-size:15px;outline:none;transition:border .2s}
        .auth-input:focus{border-color:var(--accent)}
        .auth-input::placeholder{color:var(--muted)}
        .auth-btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s;margin-top:6px;color:white}
        .auth-btn.primary{background:var(--accent)}
        .auth-btn.primary:hover{background:#6a9fd8}
        .auth-btn.secondary{background:transparent;border:2px solid var(--accent);color:var(--accent)}
        .auth-btn.secondary:hover{background:rgba(82,136,193,.1)}
        .auth-btn:disabled{opacity:.5;cursor:not-allowed}
        .auth-error{color:var(--red);font-size:13px;min-height:20px;margin:8px 0}
        .auth-switch{color:var(--muted);font-size:13px;margin-top:15px;cursor:pointer}
        .auth-switch span{color:var(--accent);text-decoration:underline}

        /* ═══ CHAT LAYOUT ═══ */
        #chat-screen{display:none;height:100vh}
        .chat-layout{display:flex;height:100%}

        /* sidebar */
        .sidebar{width:300px;min-width:300px;background:var(--sidebar);display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.05)}
        .sidebar-header{padding:14px 18px;background:var(--header);font-size:16px;font-weight:600;display:flex;align-items:center;gap:10px;min-height:56px}
        .room-section-title{padding:8px 18px 4px;font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:1px;font-weight:600}
        .room-list{flex:1;overflow-y:auto;padding:4px 6px}
        .room-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:8px;cursor:pointer;transition:background .15s;margin-bottom:2px}
        .room-item:hover{background:var(--hover)}
        .room-item.active{background:var(--accent)!important}
        .room-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
        .room-info{flex:1;min-width:0}
        .room-name{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .room-meta{font-size:11px;color:var(--muted)}
        .room-badge{background:var(--accent);color:white;border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700}

        /* new room */
        .new-room-bar{padding:10px;border-top:1px solid rgba(255,255,255,.05);display:flex;gap:6px}
        .new-room-bar input{flex:1;padding:8px 12px;background:var(--input-bg);border:none;border-radius:8px;color:var(--text);font-size:13px;outline:none}
        .new-room-bar button{padding:8px 12px;background:var(--accent);border:none;border-radius:8px;color:white;font-size:13px;cursor:pointer}

        /* my profile */
        .my-profile{padding:12px 18px;background:var(--header);display:flex;align-items:center;gap:12px;border-top:1px solid rgba(255,255,255,.05)}
        .avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:white;flex-shrink:0}
        .my-profile-info{flex:1}
        .my-profile-name{font-size:14px;font-weight:600}
        .my-profile-status{font-size:11px;color:var(--green)}
        .exit-btn{background:transparent;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:6px;border-radius:6px;transition:all .15s}
        .exit-btn:hover{color:var(--red);background:rgba(224,93,93,.1)}

        /* main */
        .chat-main{flex:1;display:flex;flex-direction:column;min-width:0}
        .chat-header{padding:10px 20px;background:var(--header);display:flex;align-items:center;gap:14px;min-height:56px;border-bottom:1px solid rgba(255,255,255,.05)}
        .chat-header-info{flex:1}
        .chat-header-title{font-size:16px;font-weight:600}
        .chat-header-sub{font-size:12px;color:var(--muted)}
        .header-btns{display:flex;gap:6px}
        .header-btn{background:transparent;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:6px 8px;border-radius:6px;transition:all .15s}
        .header-btn:hover{color:var(--text);background:var(--hover)}
        .header-btn.active{color:var(--accent)}

        /* pinned bar */
        .pinned-bar{padding:8px 20px;background:rgba(77,205,107,.08);border-bottom:1px solid rgba(77,205,107,.15);font-size:13px;display:none;cursor:pointer}
        .pinned-bar:hover{background:rgba(77,205,107,.12)}
        .pinned-bar .pin-icon{margin-right:6px}

        /* search bar */
        .search-bar{padding:8px 20px;background:var(--header);border-bottom:1px solid rgba(255,255,255,.05);display:none}
        .search-bar input{width:100%;padding:10px 14px;background:var(--input-bg);border:none;border-radius:8px;color:var(--text);font-size:14px;outline:none}
        .search-bar input::placeholder{color:var(--muted)}

        /* messages */
        .messages-area{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:4px;scroll-behavior:smooth}
        .messages-area::-webkit-scrollbar{width:6px}
        .messages-area::-webkit-scrollbar-track{background:transparent}
        .messages-area::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}

        .msg-row{display:flex;animation:fadeIn .2s ease;position:relative}
        @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        .msg-row.mine{justify-content:flex-end}
        .msg-row.theirs{justify-content:flex-start}
        .msg-row.system{justify-content:center}

        .msg-bubble{max-width:480px;padding:8px 14px 6px;border-radius:12px 12px 12px 4px;word-wrap:break-word;position:relative}
        .msg-row.mine .msg-bubble{background:var(--bubble-my);border-radius:12px 12px 4px 12px}
        .msg-row.theirs .msg-bubble{background:var(--bubble-other)}
        .msg-bubble.pinned-msg{border-left:3px solid var(--green)}
        .msg-sender{font-size:12px;font-weight:700;margin-bottom:2px}
        .msg-text{font-size:15px;line-height:1.45}
        .msg-time{font-size:10px;color:rgba(255,255,255,.35);text-align:right;margin-top:3px;display:flex;align-items:center;justify-content:flex-end;gap:4px}
        .msg-edited{font-style:italic;font-size:10px;color:rgba(255,255,255,.3)}
        .msg-system{font-size:13px;color:var(--muted);font-style:italic;background:rgba(255,255,255,.04);padding:6px 16px;border-radius:12px}

        /* reply */
        .msg-reply{padding:4px 10px;margin-bottom:4px;border-left:3px solid var(--reply-border);border-radius:2px;background:rgba(82,136,193,.1);font-size:12px;cursor:pointer}
        .msg-reply-sender{font-weight:700;color:var(--accent);font-size:11px}
        .msg-reply-text{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:300px}

        /* msg actions */
        .msg-actions{position:absolute;top:-8px;right:8px;display:none;gap:2px;background:var(--header);border-radius:8px;padding:2px;box-shadow:0 2px 10px rgba(0,0,0,.3)}
        .msg-row:hover .msg-actions{display:flex}
        .msg-action-btn{background:transparent;border:none;color:var(--muted);font-size:14px;cursor:pointer;padding:4px 6px;border-radius:4px;transition:all .1s}
        .msg-action-btn:hover{color:var(--text);background:var(--hover)}

        /* typing */
        .typing-bar{padding:2px 24px;font-size:12px;color:var(--muted);font-style:italic;min-height:22px}

        /* reply preview */
        .reply-preview{padding:8px 20px;background:var(--header);border-top:1px solid rgba(255,255,255,.05);display:none;align-items:center;gap:10px;font-size:13px}
        .reply-preview-text{flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .reply-preview .close-reply{background:transparent;border:none;color:var(--muted);font-size:16px;cursor:pointer}

        /* input bar */
        .input-bar{padding:10px 16px;background:var(--sidebar);display:flex;align-items:center;gap:10px;border-top:1px solid rgba(255,255,255,.05);position:relative}
        .emoji-btn{background:transparent;border:none;font-size:22px;cursor:pointer;padding:6px;border-radius:8px;transition:background .15s}
        .emoji-btn:hover{background:var(--hover)}
        .msg-input{flex:1;padding:12px 18px;background:var(--input-bg);border:none;border-radius:22px;color:var(--text);font-size:15px;outline:none}
        .msg-input::placeholder{color:var(--muted)}
        .send-btn{width:42px;height:42px;background:var(--accent);border:none;border-radius:50%;color:white;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
        .send-btn:hover{background:#6a9fd8}
        .send-btn:active{transform:scale(.92)}

        /* emoji picker */
        .emoji-picker{display:none;position:absolute;bottom:60px;left:16px;background:var(--header);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px;z-index:100;box-shadow:0 8px 30px rgba(0,0,0,.4);max-height:250px;overflow-y:auto}
        .emoji-picker.show{display:block}
        .emoji-category{font-size:11px;color:var(--muted);padding:6px 4px 4px;font-weight:600}
        .emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
        .emoji-grid button{background:transparent;border:none;font-size:22px;padding:6px;cursor:pointer;border-radius:6px;transition:background .1s}
        .emoji-grid button:hover{background:var(--hover)}

        /* user panel */
        .user-panel{display:none;width:260px;min-width:260px;background:var(--sidebar);border-left:1px solid rgba(255,255,255,.05);flex-direction:column}
        .user-panel.show{display:flex}
        .user-panel-header{padding:14px 18px;background:var(--header);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
        .user-list{flex:1;overflow-y:auto;padding:6px}
        .user-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:8px;cursor:pointer;transition:background .15s}
        .user-item:hover{background:var(--hover)}
        .user-item.me{cursor:default}
        .user-item.me:hover{background:transparent}
        .user-name{font-size:14px}
        .online-indicator{width:8px;height:8px;border-radius:50%;margin-left:auto;flex-shrink:0}
        .online-indicator.on{background:var(--green)}

        /* pinned panel */
        .pinned-panel{display:none;position:absolute;top:56px;right:0;width:350px;max-height:400px;background:var(--header);border:1px solid rgba(255,255,255,.1);border-radius:0 0 12px 12px;box-shadow:0 8px 30px rgba(0,0,0,.3);overflow-y:auto;z-index:50;padding:10px}
        .pinned-panel.show{display:block}
        .pinned-msg-item{padding:8px 12px;border-left:3px solid var(--green);margin-bottom:8px;border-radius:4px;background:rgba(77,205,107,.05);font-size:13px}
        .pinned-msg-sender{font-weight:700;font-size:12px;color:var(--green)}
        .pinned-msg-text{margin-top:2px}

        @media(max-width:768px){.sidebar{display:none}.user-panel{display:none!important}}
    </style>
</head>
<body>

<!-- ═══ AUTH ═══ -->
<div id="auth-screen">
    <div class="auth-card">
        <div class="auth-logo">💬</div>
        <div class="auth-title">MessageBox</div>
        <div class="auth-sub" id="auth-subtitle">Создайте аккаунт</div>
        <input id="inp-username" class="auth-input" placeholder="Имя пользователя" maxlength="20" autofocus>
        <input id="inp-password" class="auth-input" type="password" placeholder="Пароль" maxlength="50">
        <div id="auth-error" class="auth-error"></div>
        <button id="btn-auth-primary" class="auth-btn primary">Зарегистрироваться</button>
        <button id="btn-auth-secondary" class="auth-btn secondary">Уже есть аккаунт? Войти</button>
        <div class="auth-switch" style="margin-top:20px;color:var(--muted);font-size:11px">v2.0 • Socket Chat</div>
    </div>
</div>

<!-- ═══ CHAT ═══ -->
<div id="chat-screen">
    <div class="chat-layout">

        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-header">💬 MessageBox</div>
            <div class="room-section-title">Комнаты</div>
            <div id="room-list" class="room-list"></div>
            <div class="new-room-bar">
                <input id="inp-new-room" placeholder="Новая комната..." maxlength="30">
                <button id="btn-new-room">＋</button>
            </div>
            <div class="my-profile">
                <div id="my-avatar" class="avatar"></div>
                <div class="my-profile-info">
                    <div id="my-name" class="my-profile-name"></div>
                    <div class="my-profile-status">В сети</div>
                </div>
                <button id="btn-exit" class="exit-btn" title="Выйти">✕</button>
            </div>
        </div>

        <!-- MAIN CHAT -->
        <div class="chat-main">
            <div class="chat-header" style="position:relative">
                <div class="chat-header-info">
                    <div id="chat-title" class="chat-header-title">Общий</div>
                    <div id="chat-subtitle" class="chat-header-sub"></div>
                </div>
                <div class="header-btns">
                    <button id="btn-search" class="header-btn" title="Поиск">🔍</button>
                    <button id="btn-pinned" class="header-btn" title="Закреплённые">📌</button>
                    <button id="btn-users" class="header-btn" title="Участники">👥</button>
                </div>
                <div id="pinned-panel" class="pinned-panel"></div>
            </div>

            <div id="pinned-bar" class="pinned-bar"></div>
            <div id="search-bar" class="search-bar">
                <input id="search-input" placeholder="Поиск сообщений...">
            </div>

            <div id="messages" class="messages-area"></div>
            <div id="typing-bar" class="typing-bar"></div>

            <div id="reply-preview" class="reply-preview">
                <div>↩️</div>
                <div class="reply-preview-text" id="reply-preview-text"></div>
                <button class="close-reply" id="btn-close-reply">✕</button>
            </div>

            <div class="input-bar">
                <div id="emoji-picker" class="emoji-picker"></div>
                <button id="btn-emoji" class="emoji-btn">😊</button>
                <input id="msg-input" class="msg-input" placeholder="Написать сообщение..." autocomplete="off">
                <button id="btn-send" class="send-btn">➤</button>
            </div>
        </div>

        <!-- USER PANEL -->
        <div id="user-panel" class="user-panel">
            <div class="user-panel-header">
                <span>Участники <span id="online-count">0</span></span>
                <button onclick="toggleUsers()" style="background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:16px">✕</button>
            </div>
            <div id="user-list" class="user-list"></div>
        </div>

    </div>
</div>

<script>
    // ═══════════════ STATE ═══════════════
    let ws=null, username='', currentRoom='general', isRegisterMode=true;
    let replyTo=null, typingUsers={}, lastTypingSent=0;
    const WS_PORT = 8887;

    // ═══════════════ DOM ═══════════════
    const $=id=>document.getElementById(id);
    const authScreen=$('auth-screen'), chatScreen=$('chat-screen');
    const inpUser=$('inp-username'), inpPass=$('inp-password');
    const btnPrimary=$('btn-auth-primary'), btnSecondary=$('btn-auth-secondary');
    const authError=$('auth-error'), authSub=$('auth-subtitle');
    const msgArea=$('messages'), msgInput=$('msg-input');
    const roomListDiv=$('room-list'), userListDiv=$('user-list');
    const chatTitle=$('chat-title'), chatSub=$('chat-subtitle');
    const typingBarEl=$('typing-bar'), replyPreview=$('reply-preview');
    const replyPreviewText=$('reply-preview-text');
    const searchBar=$('search-bar'), searchInput=$('search-input');
    const pinnedBar=$('pinned-bar'), pinnedPanel=$('pinned-panel');
    const onlineCountEl=$('online-count');

    // colors
    const COLORS=['#e57373','#f06292','#ba68c8','#9575cd','#7986cb','#64b5f6','#4fc3f7','#4dd0e1','#4db6ac','#81c784','#aed581','#fff176','#ffd54f','#ffb74d','#ff8a65'];
    function colorFor(n){let h=0;for(let i=0;i<n.length;i++)h=n.charCodeAt(i)+((h<<5)-h);return COLORS[Math.abs(h)%COLORS.length]}
    function initial(n){return n.charAt(0).toUpperCase()}
    function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
    function fmtTime(ts){const d=new Date(ts);return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')}
    function plural(n){const r=n%100,d=n%10;if(r>=11&&r<=19)return'участников';if(d===1)return'участник';if(d>=2&&d<=4)return'участника';return'участников'}

    // ═══════════════ AUTH ═══════════════
    btnSecondary.addEventListener('click',()=>{
        isRegisterMode=!isRegisterMode;
        authSub.textContent=isRegisterMode?'Создайте аккаунт':'Войдите в аккаунт';
        btnPrimary.textContent=isRegisterMode?'Зарегистрироваться':'Войти';
        btnSecondary.textContent=isRegisterMode?'Уже есть аккаунт? Войти':'Нет аккаунта? Создать';
        authError.textContent='';
    });

    btnPrimary.addEventListener('click',doAuth);
    inpPass.addEventListener('keydown',e=>{if(e.key==='Enter')doAuth()});

    function doAuth(){
        const name=inpUser.value.trim(), pass=inpPass.value;
        if(!name||!pass){authError.textContent='Заполните все поля';return}
        authError.textContent='';
        btnPrimary.disabled=true;

        const host=location.hostname||'localhost';
        try{ws=new WebSocket(`ws://${host}:${WS_PORT}`)}
        catch(e){authError.textContent=e.message;btnPrimary.disabled=false;return}

        ws.onopen=()=>{
            ws.send(JSON.stringify({
                type:isRegisterMode?'REGISTER':'LOGIN',
                sender:name, content:pass, timestamp:Date.now()
            }));
        };

        ws.onmessage=e=>{
            const msg=JSON.parse(e.data);
            if(msg.type==='AUTH_OK'){
                username=msg.content;
                authScreen.style.display='none';
                chatScreen.style.display='flex';
                $('my-name').textContent=username;
                $('my-avatar').textContent=initial(username);
                $('my-avatar').style.background=colorFor(username);
                document.title='MessageBox — '+username;
                msgInput.focus();
            }else if(msg.type==='AUTH_FAIL'){
                authError.textContent=msg.content;
                btnPrimary.disabled=false;
                ws.close();
            }else{
                handleMessage(msg);
            }
        };

        ws.onerror=()=>{authError.textContent='Не удалось подключиться';btnPrimary.disabled=false};
        ws.onclose=()=>{
            if(chatScreen.style.display==='flex'){
                addSystem('⚠ Соединение потеряно');
                chatSub.textContent='Отключено';
                chatSub.style.color='var(--red)';
            }else{btnPrimary.disabled=false}
        };
    }

    // ═══════════════ MESSAGE HANDLER ═══════════════
    function handleMessage(msg){
        switch(msg.type){
            case'CHAT_MESSAGE':addChatMsg(msg);break;
            case'EDIT_MESSAGE':editMsg(msg);break;
            case'DELETE_MESSAGE':deleteMsg(msg);break;
            case'SERVER_MESSAGE':if(msg.roomId===currentRoom||!msg.roomId)addSystem(msg.content);break;
            case'USER_LIST':updateUsers(msg.content);break;
            case'ROOM_LIST':updateRooms(msg.content);break;
            case'SWITCH_ROOM':currentRoom=msg.content;break;
            case'TYPING':showTyping(msg.sender);break;
            case'SEARCH_RESULT':showSearchResults(msg.content);break;
            case'PINNED_MESSAGES':updatePinned(msg.content);break;
        }
    }

    // ═══════════════ MESSAGES ═══════════════
    function addChatMsg(msg){
        if(msg.roomId&&msg.roomId!==currentRoom)return;

        const mine=msg.sender===username;
        const row=document.createElement('div');
        row.className=`msg-row ${mine?'mine':'theirs'}`;
        row.dataset.id=msg.id;

        const bubble=document.createElement('div');
        bubble.className='msg-bubble'+(msg.pinned?' pinned-msg':'');
        let html='';

        // Reply
        if(msg.replyToSender){
            html+=`<div class="msg-reply">
                <div class="msg-reply-sender">${esc(msg.replyToSender)}</div>
                <div class="msg-reply-text">${esc(msg.replyToContent||'')}</div>
            </div>`;
        }

        if(!mine)html+=`<div class="msg-sender" style="color:${colorFor(msg.sender)}">${esc(msg.sender)}</div>`;
        html+=`<div class="msg-text">${formatText(msg.content)}</div>`;
        html+=`<div class="msg-time">${msg.edited?'<span class="msg-edited">ред.</span>':''}${msg.pinned?'📌 ':''}${fmtTime(msg.timestamp)}</div>`;

        bubble.innerHTML=html;

        // Actions
        const actions=document.createElement('div');
        actions.className='msg-actions';
        actions.innerHTML=`
            <button class="msg-action-btn" onclick="replyMsg('${msg.id}','${esc(msg.sender)}','${esc(msg.content?.substring(0,50)||"")}')" title="Ответить">↩️</button>
            <button class="msg-action-btn" onclick="pinMsg('${msg.id}')" title="Закрепить">📌</button>
            ${mine?`<button class="msg-action-btn" onclick="editMsgPrompt('${msg.id}')" title="Редактировать">✏️</button>
            <button class="msg-action-btn" onclick="delMsg('${msg.id}')" title="Удалить">🗑️</button>`:''}
        `;

        row.appendChild(bubble);
        row.appendChild(actions);
        msgArea.appendChild(row);
        scrollBottom();
    }

    function formatText(t){
        if(!t)return'';
        t=esc(t);
        // Bold **text**
        t=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
        // Italic *text*
        t=t.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g,'<em>$1</em>');
        // Code `text`
        t=t.replace(/`(.+?)`/g,'<code style="background:rgba(255,255,255,.1);padding:2px 6px;border-radius:4px;font-size:13px">$1</code>');
        // Links
        t=t.replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" style="color:var(--accent)">$1</a>');
        return t;
    }

    function addSystem(text){
        const row=document.createElement('div');
        row.className='msg-row system';
        row.innerHTML=`<div class="msg-system">${esc(text)}</div>`;
        msgArea.appendChild(row);
        scrollBottom();
    }

    function editMsg(msg){
        const el=document.querySelector(`.msg-row[data-id="${msg.id}"]`);
        if(el){
            const txt=el.querySelector('.msg-text');
            if(txt)txt.innerHTML=formatText(msg.content);
            const time=el.querySelector('.msg-time');
            if(time&&!time.querySelector('.msg-edited')){
                time.insertAdjacentHTML('afterbegin','<span class="msg-edited">ред.</span>');
            }
        }
    }

    function deleteMsg(msg){
        const el=document.querySelector(`.msg-row[data-id="${msg.id}"]`);
        if(el)el.remove();
    }

    function scrollBottom(){requestAnimationFrame(()=>{msgArea.scrollTop=msgArea.scrollHeight})}

    // ═══════════════ MSG ACTIONS ═══════════════
    function replyMsg(id,sender,text){
        replyTo={id,sender,content:text};
        replyPreviewText.textContent=`${sender}: ${text}`;
        replyPreview.style.display='flex';
        msgInput.focus();
    }

    $('btn-close-reply').addEventListener('click',()=>{replyTo=null;replyPreview.style.display='none'});

    function editMsgPrompt(id){
        const el=document.querySelector(`.msg-row[data-id="${id}"] .msg-text`);
        if(!el)return;
        const current=el.textContent;
        const newText=prompt('Редактировать сообщение:',current);
        if(newText!==null&&newText.trim()&&newText!==current){
            ws.send(JSON.stringify({type:'EDIT_MESSAGE',id:id,sender:username,content:newText.trim(),roomId:currentRoom,timestamp:Date.now()}));
        }
    }

    function delMsg(id){
        if(confirm('Удалить сообщение?')){
            ws.send(JSON.stringify({type:'DELETE_MESSAGE',id:id,sender:username,roomId:currentRoom,timestamp:Date.now()}));
        }
    }

    function pinMsg(id){
        ws.send(JSON.stringify({type:'PIN_MESSAGE',id:id,sender:username,roomId:currentRoom,timestamp:Date.now()}));
    }

    // ═══════════════ ROOMS ═══════════════
    function updateRooms(json){
        const rooms=JSON.parse(json);
        roomListDiv.innerHTML='';

        rooms.forEach(r=>{
            const item=document.createElement('div');
            item.className='room-item'+(r.id===currentRoom?' active':'');

            let icon='💬',iconBg='var(--accent)';
            if(r.type==='DIRECT_MESSAGE'){icon='💌';iconBg='var(--pm-border)'}
            else if(r.name?.startsWith('🌍'))icon='🌍';
            else if(r.name?.startsWith('🎲'))icon='🎲';
            else if(r.name?.startsWith('💻'))icon='💻';
            else if(r.name?.startsWith('💌'))icon='💌';

            item.innerHTML=`
                <div class="room-icon" style="background:${iconBg}">${icon}</div>
                <div class="room-info">
                    <div class="room-name">${esc(r.name)}</div>
                    <div class="room-meta">${r.messageCount||0} сообщений</div>
                </div>`;

            item.addEventListener('click',()=>{
                if(r.id===currentRoom)return;
                msgArea.innerHTML='';
                ws.send(JSON.stringify({type:'SWITCH_ROOM',roomId:r.id,sender:username,content:'',timestamp:Date.now()}));
                currentRoom=r.id;
                chatTitle.textContent=r.name?.replace(/^[^\s]+\s/,'')||r.id;
                document.querySelectorAll('.room-item').forEach(i=>i.classList.remove('active'));
                item.classList.add('active');
            });

            // DM shortcut
            if(r.dmUser){
                item.addEventListener('dblclick',()=>{});
            }

            roomListDiv.appendChild(item);
        });
    }

    $('btn-new-room').addEventListener('click',createRoom);
    $('inp-new-room').addEventListener('keydown',e=>{if(e.key==='Enter')createRoom()});

    function createRoom(){
        const name=$('inp-new-room').value.trim();
        if(!name)return;
        ws.send(JSON.stringify({type:'CREATE_ROOM',sender:username,content:name,timestamp:Date.now()}));
        $('inp-new-room').value='';
    }

    // ═══════════════ USERS ═══════════════
    function updateUsers(csv){
        userListDiv.innerHTML='';
        if(!csv){onlineCountEl.textContent='0';return}

        const users=csv.split(',').filter(u=>u.trim());
        onlineCountEl.textContent=users.length;

        users.forEach(user=>{
            user=user.trim();
            const isMe=user===username;
            const item=document.createElement('div');
            item.className='user-item'+(isMe?' me':'');
            item.innerHTML=`
                <div class="avatar" style="background:${colorFor(user)}">${initial(user)}</div>
                <div class="user-name">${esc(user)}${isMe?' (Вы)':''}</div>
                <div class="online-indicator on"></div>`;

            if(!isMe){
                item.addEventListener('click',()=>{
                    // Открываем/создаём ЛС
                    ws.send(JSON.stringify({type:'PRIVATE_MESSAGE',sender:username,content:'👋',recipient:user,timestamp:Date.now()}));
                });
            }
            userListDiv.appendChild(item);
        });
    }

    function toggleUsers(){$('user-panel').classList.toggle('show');$('btn-users').classList.toggle('active')}
    $('btn-users').addEventListener('click',toggleUsers);

    // ═══════════════ SEND ═══════════════
    $('btn-send').addEventListener('click',sendMsg);
    msgInput.addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg()});

    function sendMsg(){
        const text=msgInput.value.trim();
        if(!text||!ws||ws.readyState!==1)return;

        // DM command
        if(text.startsWith('/pm ')){
            const parts=text.substring(4).split(' ');
            const recipient=parts.shift();
            const content=parts.join(' ');
            if(recipient&&content){
                ws.send(JSON.stringify({type:'PRIVATE_MESSAGE',sender:username,content,recipient,timestamp:Date.now()}));
            }
            msgInput.value='';return;
        }

        const msg={type:replyTo?'REPLY_MESSAGE':'CHAT_MESSAGE',sender:username,content:text,roomId:currentRoom,timestamp:Date.now()};

        if(replyTo){
            msg.replyToId=replyTo.id;
            msg.replyToSender=replyTo.sender;
            msg.replyToContent=replyTo.content;
        }

        ws.send(JSON.stringify(msg));
        msgInput.value='';
        replyTo=null;
        replyPreview.style.display='none';
    }

    // ═══════════════ TYPING ═══════════════
    msgInput.addEventListener('input',()=>{
        const now=Date.now();
        if(now-lastTypingSent>2000&&ws&&ws.readyState===1){
            ws.send(JSON.stringify({type:'TYPING',sender:username,content:'',timestamp:now}));
            lastTypingSent=now;
        }
    });

    function showTyping(who){
        typingUsers[who]=Date.now();
        updateTyping();
        setTimeout(()=>{const now=Date.now();for(const u in typingUsers)if(now-typingUsers[u]>3000)delete typingUsers[u];updateTyping()},3000);
    }

    function updateTyping(){
        const names=Object.keys(typingUsers);
        if(!names.length)typingBarEl.textContent='';
        else if(names.length===1)typingBarEl.textContent=names[0]+' печатает...';
        else typingBarEl.textContent=names.length+' чел. печатают...';
    }

    // ═══════════════ SEARCH ═══════════════
    $('btn-search').addEventListener('click',()=>{
        const vis=searchBar.style.display==='block';
        searchBar.style.display=vis?'none':'block';
        $('btn-search').classList.toggle('active');
        if(!vis)searchInput.focus();
    });

    searchInput.addEventListener('input',()=>{
        const q=searchInput.value.trim();
        if(q.length>=2){
            ws.send(JSON.stringify({type:'SEARCH_REQUEST',sender:username,content:q,roomId:currentRoom,timestamp:Date.now()}));
        }else{
            // clear search — reload room
            msgArea.innerHTML='';
            ws.send(JSON.stringify({type:'SWITCH_ROOM',roomId:currentRoom,sender:username,content:'',timestamp:Date.now()}));
        }
    });

    function showSearchResults(json){
        const results=JSON.parse(json);
        msgArea.innerHTML='';
        if(!results.length){addSystem('Ничего не найдено');return}
        addSystem(`Найдено: ${results.length} сообщений`);
        results.forEach(m=>addChatMsg(m));
    }

    // ═══════════════ PINNED ═══════════════
    $('btn-pinned').addEventListener('click',()=>{
        pinnedPanel.classList.toggle('show');
        $('btn-pinned').classList.toggle('active');
        if(pinnedPanel.classList.contains('show')){
            ws.send(JSON.stringify({type:'PINNED_MESSAGES',sender:username,roomId:currentRoom,timestamp:Date.now()}));
        }
    });

    function updatePinned(json){
        const msgs=JSON.parse(json);
        pinnedPanel.innerHTML='';

        if(!msgs.length){
            pinnedPanel.innerHTML='<div style="padding:20px;text-align:center;color:var(--muted)">Нет закреплённых сообщений</div>';
            pinnedBar.style.display='none';
            return;
        }

        pinnedBar.style.display='block';
        pinnedBar.innerHTML=`<span class="pin-icon">📌</span> ${msgs.length} закреплённых сообщений`;

        msgs.forEach(m=>{
            const item=document.createElement('div');
            item.className='pinned-msg-item';
            item.innerHTML=`<div class="pinned-msg-sender">${esc(m.sender)}</div><div class="pinned-msg-text">${esc(m.content)}</div>`;
            pinnedPanel.appendChild(item);
        });
    }

    pinnedBar.addEventListener('click',()=>{
        pinnedPanel.classList.toggle('show');
        $('btn-pinned').classList.toggle('active');
    });

    document.addEventListener('click',e=>{
        if(!pinnedPanel.contains(e.target)&&e.target!==$('btn-pinned')&&e.target!==pinnedBar){
            pinnedPanel.classList.remove('show');
            $('btn-pinned').classList.remove('active');
        }
    });

    // ═══════════════ EMOJI ═══════════════
    const EMOJI_DATA={
        'Смайлы':['😀','😂','😍','🤔','😎','😊','🥰','😏','😢','😡','🥳','😇','😱','😴','🤗','🤩','😤','🤯','🥺','😈','🤡','🥶','🤢','😵','🫠'],
        'Жесты':['👍','👎','👋','🤝','🙏','💪','👏','🫡','✌️','🤟','👆','👇','☝️','👌','🤙'],
        'Сердца':['❤️','🧡','💛','💚','💙','💜','🖤','🤍','💔','💕','💖','💗','💘'],
        'Символы':['🔥','⭐','✨','💯','✅','❌','⚡','💎','🎉','🎊','🏆','🎯','💡','🔔','🚀'],
        'Еда':['🍕','🍔','🍟','☕','🍺','🍷','🍰','🍩','🍿','🌮']
    };

    const picker=$('emoji-picker');
    for(const[cat,emojis]of Object.entries(EMOJI_DATA)){
        const title=document.createElement('div');
        title.className='emoji-category';
        title.textContent=cat;
        picker.appendChild(title);

        const grid=document.createElement('div');
        grid.className='emoji-grid';
        emojis.forEach(em=>{
            const btn=document.createElement('button');
            btn.textContent=em;
            btn.addEventListener('click',()=>{
                msgInput.value+=em;
                picker.classList.remove('show');
                msgInput.focus();
            });
            grid.appendChild(btn);
        });
        picker.appendChild(grid);
    }

    $('btn-emoji').addEventListener('click',e=>{e.stopPropagation();picker.classList.toggle('show')});
    document.addEventListener('click',e=>{if(!picker.contains(e.target)&&e.target!==$('btn-emoji'))picker.classList.remove('show')});

    // ═══════════════ EXIT ═══════════════
    $('btn-exit').addEventListener('click',()=>{
        if(ws)ws.close();
        chatScreen.style.display='none';
        authScreen.style.display='flex';
        msgArea.innerHTML='';
        roomListDiv.innerHTML='';
        userListDiv.innerHTML='';
        btnPrimary.disabled=false;
        document.title='MessageBox';
        authError.textContent='';
    });
</script>
</body>
</html>
